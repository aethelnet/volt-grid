name: Deploy VoltGrid Static WASM Studio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assemble static bundle (Frontend + SQLite WASM snapshot + CNAME)
        run: |
          mkdir -p _site
          cp -r frontend/* _site/
          cp frontend/index.html _site/404.html
          cp data/voltbase.db _site/voltbase.db
          printf "volt.aethelburg.network\n" > _site/CNAME
          touch _site/.nojekyll

      - name: Publish static bundle to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy VoltGrid v1.1 Static WASM Studio to volt.aethelburg.network"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages
